<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistem Digital</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">
        <div class="login-card">
            <!-- HEADER LOGIN -->
            <div class="login-header">
                <h1>LOGIN</h1>
                <p>
                    Silakan masuk untuk mengakses sistem
                </p>
            </div>


            <!-- FORM LOGIN -->
            <div class="login-form">
                <div class="form-group">
                    <label for="username">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                    >
                </div>
<button type="button" id="btnLogin" class="btn-login">
    <span id="loginText">MASUK</span>
    <span id="loginSpinner" class="login-spinner"></span>
</button>
<button type="button" id="btnPanduan" class="btn-tanya">i</button>

<div id="modalPanduan" class="modal-panduan">
    <div class="isi-panduan">
        <button type="button" id="tutupPanduan" class="tutup-panduan">×</button>

        <h3>📖 Reminder</h3>
        <p>Jika Terdapat Kendala Pada Saat Login, Silahkan Menghubungi Admin Pengelola Logbook Digital Unit Aviation Security</p>
        

        <a href="panduan.html" class="panduan-lengkap">
            Lihat Panduan Lengkap
        </a>
    </div>
</div>


                <p
                    id="pesanLogin"
                    class="pesan-login">
                </p>

            </div>


            <!-- FOOTER -->
            <div class="login-footer">
                <p>
                    Unit Aviation Security
                </p>
                <span>
                    Sistem Digital Tata Kelola Logbook Harian
                </span>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT LOGIN -->
    <script src="login.js"></script>
    <script>
        const btnPanduan = document.getElementById("btnPanduan");
const modalPanduan = document.getElementById("modalPanduan");
const tutupPanduan = document.getElementById("tutupPanduan");

btnPanduan.onclick = () => {
    modalPanduan.style.display = "flex";
};

tutupPanduan.onclick = () => {
    modalPanduan.style.display = "none";
};

modalPanduan.onclick = (e) => {
    if (e.target === modalPanduan) {
        modalPanduan.style.display = "none";
    }
};
    </script>


</body>

</html>
